<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client Brief — Rabeez</title>
<link rel="preload" href="/fonts/Rakik-Light.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/BaybarsDisplay-Light.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'HT Baybars Display';src:url('/fonts/BaybarsDisplay-Light.woff2') format('woff2');font-weight:300;font-style:normal;font-display:swap}
@font-face{font-family:'HT Baybars Display';src:url('/fonts/BaybarsDisplay-Bold.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:'HT Rakik';src:url('/fonts/Rakik-Light.woff2') format('woff2');font-weight:300;font-style:normal;font-display:swap}
@font-face{font-family:'HT Rakik';src:url('/fonts/Rakik-Medium.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'Sunset Gothic Pro';src:url('/fonts/SunsetGothic-Thin.woff2') format('woff2');font-weight:200;font-style:normal;font-display:swap}
@font-face{font-family:'Sunset Gothic Pro';src:url('/fonts/SunsetGothic-Regular.woff2') format('woff2');font-weight:300 700;font-style:normal;font-display:swap}
@font-face{font-family:'Albra';src:url('/fonts/Albra-Regular.woff2') format('woff2');font-weight:300 400;font-style:normal;font-display:swap}
@font-face{font-family:'Albra';src:url('/fonts/Albra-Medium.woff2') format('woff2');font-weight:500 700;font-style:normal;font-display:swap}
:root{
  /* Eloqwnt-inspired monochrome palette */
  --bg:#E5E9EB;         /* page background — light gray */
  --surface:#FFFFFF;    /* white cards */
  --surface-2:#F2F7F9;  /* subtle alt surface */
  --surface-3:#EEF2F4;  /* input fill */
  --border:rgba(0,0,0,.10);
  --border-2:rgba(0,0,0,.18);
  --text:#000000;       /* primary ink */
  --text-2:#222222;     /* secondary */
  --text-3:#A9ACAD;     /* muted */
  --accent:#0A57FF;     /* blue, now reserved for subtle highlights only */
  --accent-soft:#E3F7FF;/* very light blue highlight tint */
  --ok:#0F8A4A;
  --err:#C8272D;
  --r:14px;
  --card-radius:24px;
  --card-radius-lg:34px;
  --pill:9999px;
  --logo-invert:1;      /* invert the white-on-black source logo to render black on light */
  --font-display:'HT Baybars Display','IBM Plex Sans Arabic',Georgia,serif;
  --font-body:'HT Rakik','IBM Plex Sans Arabic',system-ui,sans-serif;
  color-scheme:light;
}
html[lang="en"]{
  --font-display:'Albra',Georgia,serif;
  --font-body:'Sunset Gothic Pro',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-weight:300;line-height:1.7;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overflow-x:hidden}
.ic{width:1em;height:1em;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.12em;flex:0 0 auto}
a{color:inherit;text-decoration:none;cursor:pointer}
button{font-family:var(--font-body)}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* topbar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 32px;background:var(--bg);position:sticky;top:0;z-index:20;backdrop-filter:saturate(180%) blur(10px)}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.adminlink{flex:0 0 auto}
.topright{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.logo-img{height:30px;width:auto;display:block}
.sep{width:1px;height:18px;background:var(--border)}
.sub{font-family:var(--font-display);font-weight:500;font-size:15px;color:var(--text)}
.adminlink{font-size:14px;font-weight:500;color:var(--text);background:#fff;border:none;border-radius:var(--pill);padding:11px 20px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;transition:transform .25s,box-shadow .25s}
.adminlink:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.06)}
.beta{font-size:10px;font-weight:500;color:var(--text-3);background:transparent;border:1px solid var(--border);border-radius:var(--pill);padding:3px 10px;letter-spacing:.06em;text-transform:uppercase;flex:0 0 auto}

/* layout */
.wrap{max-width:880px;margin:0 auto;padding:32px 24px 80px}
.wrapw{max-width:1100px;margin:0 auto;padding:32px 24px 80px}
.card{background:var(--surface);border-radius:var(--card-radius-lg);overflow:hidden}
.cardbody{padding:44px 48px}

/* progress */
.progwrap{display:flex;align-items:center;gap:16px;margin:0 0 24px}
.prog{flex:1;height:3px;background:rgba(0,0,0,.07);border-radius:var(--pill);overflow:hidden}
.prog-fill{height:100%;background:var(--text);border-radius:var(--pill);transition:width .4s ease}
.progtext{font-size:13px;color:var(--text-3);white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:500}

/* eyebrow + question */
.eyebrow{display:inline-flex;align-items:center;gap:10px;margin-bottom:28px;font-size:14px;color:var(--text);font-weight:500;outline:none}
.dot{width:8px;height:8px;border-radius:var(--pill);background:var(--text);flex:0 0 auto}
.qblock{padding:24px 0;border-top:1px solid var(--border)}
.qblock:first-of-type{border-top:none;padding-top:4px}
.contact-subh{display:flex;align-items:center;gap:10px;padding:24px 0 4px;font-family:var(--font-display);font-size:13px;font-weight:500;color:var(--text);text-transform:uppercase;letter-spacing:.06em}
.q{margin:0;font-family:var(--font-body);font-weight:500;font-size:1.25rem;line-height:1.5;color:var(--text);letter-spacing:0}
.req{color:var(--text-3);font-weight:300}
.qmark{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;border:1px solid var(--border);background:#fff;color:var(--text-3);font-size:13px;font-weight:500;cursor:pointer;margin-inline-start:8px;vertical-align:middle;line-height:1;padding:0;transition:border-color .2s,color .2s}
.qmark:hover{border-color:var(--text-2);color:var(--text)}
.scaffold{margin:10px 0 0;font-size:14px;color:var(--text-3);line-height:1.7}

/* collapsible help */
.collapsible{overflow:hidden;max-height:600px;transition:max-height .25s ease}
.collapsible.closed{max-height:0}
.help{margin-top:14px}
.help-inner{background:var(--surface-2);border-radius:var(--r);padding:18px 20px}
.help-inner p{margin:0;font-size:14px;line-height:1.75;color:var(--text-2)}
.help-inner p+p{margin-top:8px}
.help-inner b{color:var(--text);font-weight:500}

/* options as pill toggle group */
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.opt{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border:1.5px solid var(--border-2);border-radius:var(--pill);background:transparent;cursor:pointer;font-size:15px;color:var(--text);font-weight:500;font-family:inherit;transition:background .2s,color .2s,border-color .2s}
.opt:hover{border-color:var(--text)}
.opt.sel{border-color:var(--text);background:var(--text);color:#fff}
.box{display:none}
.err-msg{font-size:13px;color:var(--err);margin-top:10px;display:flex;align-items:center;gap:4px}
.qblock.erred .inp{border-color:var(--err)}
.opt:focus-visible,.adj:focus-visible,.sopt:focus-visible{outline:2px solid var(--text);outline-offset:3px}
.submit-err{font-size:14px;color:var(--err);text-align:center;margin-top:14px;padding:12px 18px;background:rgba(200,39,45,.07);border-radius:var(--pill)}

/* scale */
.scale{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.sopt{flex:1;min-width:80px;text-align:center;padding:12px 14px;border:1.5px solid var(--border-2);border-radius:var(--pill);background:transparent;cursor:pointer;font-size:14px;color:var(--text-2);font-weight:500;transition:background .2s,color .2s,border-color .2s}
.sopt:hover{border-color:var(--text)}
.sopt.sel{border-color:var(--text);background:var(--text);color:#fff}

/* adjective pills */
.adjwrap{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.adj{padding:10px 18px;border:1.5px solid var(--border-2);border-radius:var(--pill);background:transparent;cursor:pointer;font-size:14px;color:var(--text-2);font-weight:500;transition:background .2s,color .2s,border-color .2s}
.adj:hover{border-color:var(--text)}
.adj.sel{border-color:var(--text);background:var(--text);color:#fff}
.adjcount{margin-top:12px;font-size:13px;color:var(--text-3)}

/* inputs */
.inp{width:100%;background:#fff;border:1.5px solid var(--border);border-radius:var(--r);padding:14px 18px;color:var(--text);font-family:var(--font-body);font-size:15px;font-weight:300;line-height:1.65;resize:vertical;margin-top:18px;overflow-wrap:break-word;transition:border-color .2s,box-shadow .2s}
.inp:focus{outline:none;border-color:var(--text);box-shadow:0 0 0 3px rgba(0,0,0,.06)}
.inp::placeholder{color:var(--text-3)}
textarea.inp{min-height:96px}

/* phone row */
.phone-row{display:flex;gap:8px;margin-top:18px;flex-wrap:nowrap}
.phone-code{flex:0 0 110px}
.phone-code .inp{margin-top:0}
.phone-num{flex:1}
.phone-num .inp{margin-top:0}

/* file upload */
.filez{margin-top:18px;display:flex;align-items:center;gap:12px;border:1.5px dashed var(--border-2);border-radius:var(--r);padding:18px;color:var(--text-2);cursor:pointer;font-size:14px;transition:border-color .2s}
.filez:hover{border-color:var(--text)}

/* repeatable add rows */
.addwrap{margin-top:18px;display:flex;flex-direction:column;gap:8px}
.addrow{display:flex;align-items:center;gap:8px;flex-wrap:nowrap}.phone-wrap .addrow{direction:ltr;unicode-bidi:isolate}
.sp-psw{position:relative;flex:0 0 auto}
.sp-trig{display:block;padding:13px 14px;font-size:15px;font-weight:500;line-height:1.5;background:#fff;border:1.5px solid var(--border);border-radius:var(--r);color:var(--text);cursor:pointer;white-space:nowrap;text-align:center;transition:border-color .2s}
.sp-trig:hover,.sp-trig.open{border-color:var(--text)}
.sp-ic{width:20px;height:20px;fill:currentColor;flex:0 0 auto;vertical-align:middle}
.sp-phtext{color:var(--text-3);vertical-align:middle}
.sp-chev{width:11px;height:11px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round;opacity:.45;vertical-align:middle;margin-inline-start:5px}
.sp-menu{position:absolute;top:calc(100% + 6px);inset-inline-start:0;z-index:30;display:grid;grid-template-columns:repeat(3,42px);gap:4px;padding:6px;background:#fff;border:1px solid var(--border);border-radius:var(--r);box-shadow:0 12px 32px rgba(0,0,0,.10)}
.sp-opt{display:flex;align-items:center;justify-content:center;width:42px;height:42px;background:transparent;border:1px solid transparent;border-radius:var(--r);color:var(--text-2);cursor:pointer}
.sp-opt:hover{color:var(--text);border-color:var(--border-2)}
.sp-opt.on{color:#fff;background:var(--text);border-color:var(--text)}
.sp-handle{flex:1;min-width:0}
.addrow .inp{margin-top:0}
.inp-sm{flex:0 0 33%}
.inp-lg{flex:1}
.delbtn{flex:0 0 42px;height:42px;border:1.5px solid var(--border);border-radius:var(--pill);background:#fff;color:var(--text-3);font-size:20px;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center;transition:border-color .2s,color .2s}
.delbtn:hover{border-color:var(--text);color:var(--text)}
.addbtn{margin-top:14px;background:transparent;border:1.5px dashed var(--border-2);color:var(--text-2);border-radius:var(--pill);padding:9px 18px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;transition:border-color .2s,color .2s}
.addbtn:hover{border-color:var(--text);color:var(--text)}

/* suggest strip */
.suggest-strip{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.suggest-chip{padding:9px 14px;border:1.5px solid var(--border-2);border-radius:var(--pill);background:transparent;cursor:pointer;font-size:14px;color:var(--text-2);font-weight:500;transition:background .2s,border-color .2s,color .2s}
.suggest-chip:hover{border-color:var(--text);color:var(--text)}
.suggest-chip.used{border-color:var(--text);background:var(--text);color:#fff}
.suggest-label{margin-top:18px;margin-bottom:6px;font-size:13px;color:var(--text-3)}

/* nav buttons (pill style) */
.nav{display:flex;align-items:center;justify-content:space-between;margin-top:36px;gap:12px}
.nav .cta,.nav .ghost{min-height:50px;justify-content:center}
.cta{display:inline-flex;align-items:center;gap:10px;background:var(--text);color:#fff;border:none;border-radius:var(--pill);padding:14px 28px;font-weight:500;font-size:16px;font-family:inherit;cursor:pointer;transition:transform .25s,box-shadow .25s,opacity .2s}
.cta:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(0,0,0,.16)}
.ghost{display:inline-flex;align-items:center;gap:10px;background:transparent;border:1.5px solid var(--border-2);color:var(--text);border-radius:var(--pill);padding:13px 24px;font-size:15px;font-weight:500;font-family:inherit;cursor:pointer;transition:border-color .2s,background .2s}
.ghost:hover{border-color:var(--text);background:#fff}
.ghost.sm{padding:9px 16px;font-size:13px;min-height:0}
.ghostcta{background:#fff;color:var(--text);border:1.5px solid var(--border-2);box-shadow:none}
.ghostcta:hover{border-color:var(--text);background:#fff}
.savenote{margin-top:20px;text-align:center;font-size:13px;color:var(--text-3)}

/* landing — editorial hero */
.land{text-align:center;padding:64px 16px 32px}
.land-logo{margin:0 auto 48px;display:flex;justify-content:center}
.land-logo img{height:40px;width:auto}
.land-eyebrow{display:inline-flex;align-items:center;gap:10px;margin:0 auto 32px;font-size:14px;color:var(--text);font-weight:500}
.land-eyebrow .dot{width:8px;height:8px;border-radius:var(--pill);background:var(--text)}
.land-title{font-family:var(--font-display);font-weight:500;font-size:clamp(40px,6vw,64px);line-height:1.05;letter-spacing:-.02em;margin:0 0 28px;color:var(--text);max-width:780px;margin-left:auto;margin-right:auto}
html[lang="ar"] .land-title{font-weight:700;letter-spacing:0}
.land-tag{margin:0 auto 36px;max-width:560px;font-size:18px;color:var(--text-2);line-height:1.6}
.land-prompt{font-size:14px;color:var(--text-3);margin:0 0 18px;text-transform:uppercase;letter-spacing:.08em;font-weight:500}
.langrow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.land-foot{margin-top:40px;font-size:13px;color:var(--text-3);line-height:1.7}
.land-meta{margin-top:36px;display:flex;justify-content:center;gap:16px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--text-3)}
.land-meta .bdot{opacity:.5}
.resume-card{max-width:520px;margin:0 auto 32px;background:#fff;border-radius:var(--card-radius);padding:24px 28px;text-align:start}
.resume-card h4{margin:0 0 6px;font-family:var(--font-display);font-weight:500;font-size:18px;color:var(--text)}
.resume-card p{margin:0 0 16px;font-size:14px;color:var(--text-2)}
.resume-card .row{display:flex;gap:10px;flex-wrap:wrap}

/* generating screen */
.gen{text-align:center;padding:80px 16px}
.gen h2{font-family:var(--font-display);font-weight:500;font-size:1.6rem;line-height:1.3;margin:24px 0 10px;letter-spacing:-.01em}
.gen p{font-size:15px;color:var(--text-2);margin:0 0 32px}
.gen-prog{max-width:360px;margin:0 auto;height:3px;background:rgba(0,0,0,.08);border-radius:var(--pill);overflow:hidden}
.gen-prog-fill{height:100%;background:var(--text);border-radius:var(--pill);transition:width .3s ease}
.gen-pct{margin-top:14px;font-size:13px;color:var(--text-3);font-variant-numeric:tabular-nums;font-weight:500}

/* thanks */
.thanks{text-align:center;padding:88px 16px}
.thanks-ic{width:64px;height:64px;border-radius:50%;background:var(--text);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:28px}
.thanks h1{font-family:var(--font-display);font-weight:500;font-size:2rem;line-height:1.2;margin:0 0 16px;letter-spacing:-.01em}
html[lang="ar"] .thanks h1{font-weight:700;letter-spacing:0}
.thanks p{font-size:16px;color:var(--text-2);margin:0 0 32px}
.navc{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

/* login */
.login{max-width:420px;margin:80px auto;padding:0 16px}
.login-logo{display:flex;justify-content:center;margin-bottom:32px}
.login-logo img{height:36px}
.login-card{background:var(--surface);border-radius:var(--card-radius);padding:36px 32px}
.login-card h2{font-family:var(--font-display);font-weight:500;font-size:1.4rem;line-height:1.3;margin:0 0 24px;text-align:center;display:flex;align-items:center;gap:10px;justify-content:center;letter-spacing:-.01em}
html[lang="ar"] .login-card h2{font-weight:700;letter-spacing:0}
.field{margin-bottom:18px}
.field label{display:block;font-size:13px;color:var(--text-2);margin-bottom:8px;font-weight:500}
.field .inp{margin-top:0}
.login-err{font-size:14px;color:var(--err);margin-top:14px;text-align:center}

/* spinner */
.spin{display:inline-block;width:32px;height:32px;border:2px solid rgba(0,0,0,.10);border-top-color:var(--text);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn-spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-3px}
.cta[disabled]{opacity:.65;cursor:default;pointer-events:none;transform:none}
.ghost[disabled]{opacity:.5;cursor:default;pointer-events:none}

/* admin dashboard */
.admin-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:32px;flex-wrap:wrap;gap:16px}
.admin-title{font-family:var(--font-display);font-weight:500;font-size:2.2rem;line-height:1.1;letter-spacing:-.02em;margin:0;color:var(--text)}
html[lang="ar"] .admin-title{font-weight:700;letter-spacing:0}
.stats{display:flex;gap:14px;margin-bottom:28px;flex-wrap:wrap}
.stat{flex:1;min-width:180px;background:#fff;border-radius:var(--card-radius);padding:24px 28px}
.stat .n{font-family:var(--font-display);font-weight:500;font-size:2.6rem;line-height:1;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
html[lang="ar"] .stat .n{font-weight:700;letter-spacing:0}
.stat .l{font-size:12px;color:var(--text-3);margin-top:8px;text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.subcard{display:flex;align-items:center;gap:18px;background:#fff;border-radius:var(--card-radius);padding:22px 28px;margin-bottom:12px;transition:transform .2s,box-shadow .2s;flex-wrap:wrap}
.subcard:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.06)}
.subinfo{flex:1;min-width:0}
.subname{font-family:var(--font-display);font-weight:500;font-size:18px;color:var(--text);letter-spacing:-.01em}
html[lang="ar"] .subname{font-weight:700;letter-spacing:0}
.submeta{font-size:13px;color:var(--text-3);margin-top:4px}
.subbtns{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:inline-flex;gap:4px;margin-bottom:20px;background:#fff;border-radius:var(--pill);padding:4px}
.tab{display:inline-flex;align-items:center;gap:8px;background:transparent;border:none;border-radius:var(--pill);color:var(--text-3);font-size:14px;font-weight:500;font-family:inherit;padding:10px 18px;cursor:pointer;transition:background .2s,color .2s}
.tab:hover{color:var(--text)}
.tab.on{color:#fff;background:var(--text)}
.tabn{font-size:11px;background:rgba(0,0,0,.08);color:var(--text-2);border-radius:var(--pill);padding:1px 8px;font-variant-numeric:tabular-nums}
.tab.on .tabn{background:rgba(255,255,255,.20);color:#fff}
.pill{font-size:12px;padding:5px 12px;border-radius:var(--pill);white-space:nowrap;font-weight:500}
.pnew{color:var(--text);background:var(--accent-soft)}
.prev2{color:var(--text-2);background:rgba(0,0,0,.06)}
.parch{color:var(--text-3);background:transparent;border:1px dashed var(--border-2)}
.empty{background:#fff;border-radius:var(--card-radius);padding:56px;text-align:center;color:var(--text-3);font-size:14px}

/* dashboard — brief detail */
.detail-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.detail-actions{display:flex;gap:8px;flex-wrap:wrap}
.cta.sm{padding:10px 18px;font-size:13px;min-height:0;box-shadow:none}
.cta.sm:hover{box-shadow:0 6px 16px rgba(0,0,0,.12)}
.bcover{background:#fff;border-radius:var(--card-radius-lg);padding:48px 44px;margin-bottom:16px}
.bcover-eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:500;color:var(--text);margin-bottom:20px}
.bcover-eyebrow .dot{width:8px;height:8px;border-radius:var(--pill);background:var(--text)}
.bcover-brand{font-family:var(--font-display);font-weight:500;font-size:3rem;line-height:1.05;letter-spacing:-.02em;margin:0;color:var(--text);overflow-wrap:break-word}
html[lang="ar"] .bcover-brand{font-weight:700;letter-spacing:0}
.bcover-sub{margin-top:14px;font-size:16px;color:var(--text-2);line-height:1.6}
.bcover-meta{margin-top:24px;display:flex;align-items:center;flex-wrap:wrap;gap:10px;font-size:13px;color:var(--text-3)}
.bdot{opacity:.55}
.contact-card{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:18px}
.cinfo{background:#fff;border-radius:var(--card-radius);padding:18px 20px;min-width:0}
.cinfo-k{font-size:11px;font-weight:500;color:var(--text-3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
.cinfo-v{font-size:15px;color:var(--text);line-height:1.6;overflow-wrap:break-word;word-break:break-word}
.bsection{background:#fff;border-radius:var(--card-radius-lg);padding:36px 40px;margin-top:16px}
.bsection-h{display:flex;align-items:center;gap:14px;font-family:var(--font-body);font-weight:500;font-size:20px;color:var(--text);letter-spacing:0;padding-bottom:18px;border-bottom:1px solid var(--border);margin-bottom:8px}
.bnum{display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;color:var(--text-3);font-variant-numeric:tabular-nums;min-width:28px}
.brow{padding:18px 0;border-bottom:1px solid var(--border);display:grid;grid-template-columns:minmax(0,36%) 1fr;gap:8px 32px}
.brow:last-child{border-bottom:none}
.brow-q{font-size:14px;font-weight:500;color:var(--text-2);line-height:1.55;display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap}
.brow-a{font-size:15px;color:var(--text);line-height:1.75;overflow-wrap:break-word;word-break:break-word}
.brow.gold .brow-q{color:var(--text)}
.b-empty{color:var(--text-3)}
.vtags{display:flex;flex-wrap:wrap;gap:6px}
.atag{display:inline-block;font-size:13px;color:var(--text);background:rgba(0,0,0,.05);border-radius:var(--pill);padding:6px 14px}
.atag.d{background:var(--accent-soft);color:var(--text)}
.gbadge{font-size:10px;color:var(--text);background:var(--accent-soft);padding:2px 8px;border-radius:var(--pill);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.gapbox{background:var(--accent-soft);border-radius:var(--card-radius);padding:24px;margin-bottom:14px}
.gaptitle{font-family:var(--font-display);font-weight:500;font-size:14px;color:var(--text);margin-bottom:16px;text-transform:uppercase;letter-spacing:.06em}
.gap{display:flex;gap:14px;align-items:stretch;flex-wrap:wrap}
.gapcol{flex:1;min-width:160px;background:#fff;border-radius:var(--r);padding:18px}
.gapcol .h{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-bottom:12px}
.gaparrow{display:flex;align-items:center;color:var(--text);flex:0 0 auto}
.gaparrow .ic{width:22px;height:22px}

/* a11y */
:focus-visible{outline:2px solid var(--text);outline-offset:2px}
@media(max-width:768px){
  .wrap,.wrapw{padding:20px 16px 64px}
  .cardbody{padding:28px 24px}
  .bcover{padding:32px 26px}
  .bsection{padding:28px 24px}
  .land{padding:40px 8px 24px}
  .topbar{padding:14px 18px}
}
@media(max-width:560px){
  .cardbody{padding:24px 18px}
  .q{font-size:1.25rem}
  .land-title{font-size:32px}
  .land{padding:32px 8px 16px}
  .gen,.thanks{padding:56px 16px}
  .topbar{padding:12px 16px}
  .adminlink{padding:9px 14px;font-size:13px}
  .sub{font-size:13px}
  .qmark{width:24px;height:24px}
  .nav{gap:8px}
  .cta{padding:12px 22px;font-size:14px}
  .ghost{padding:11px 18px;font-size:14px}
  .subcard{padding:18px;gap:12px}
  .phone-code{flex:0 0 90px}
  .phone-code .inp{padding-inline:12px}
  .brow{grid-template-columns:1fr;gap:6px}
  .brow-q{font-size:13px}
  .bcover-brand{font-size:2rem}
  .admin-title{font-size:1.6rem}
  .gaparrow{transform:rotate(90deg);align-self:center;margin:0 auto}
  .detail-bar .cta.sm span,.detail-bar .ghost.sm span{font-size:12px}
}
@media(max-width:380px){
  .sep,.sub{display:none}
  .stat{min-width:0}
  .cta span,.ghost span{font-size:14px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ── dynamic stages (set after generation) ── */
var DYNAMIC_COUNT=7;     // number of strategic stages we generate
var DYNAMIC_STAGES=null; // null = not generated (use static fallback);
                         // otherwise an array of length DYNAMIC_COUNT whose
                         // slots fill in progressively (null slot = still loading)

function allStages(){
  var base=STAGES.slice(0,2); // stages 1-2 always static
  if(DYNAMIC_STAGES===null) return base.concat(STAGES.slice(2)); // fallback
  var rest=DYNAMIC_STAGES.map(function(s){
    return s || {title:{ar:"…",en:"…"},questions:[],_loading:true};
  });
  return base.concat(rest);
}

function totalStages(){return allStages().length;}
function currentStageData(){return allStages()[state.stage-1];}

/* ── helpers ───────────────────────────────────────────────────── */
/* Global rule: render every digit as Latin 0-9 across the platform. */
function toLatin(s){return String(s==null?"":s).replace(/[٠-٩۰-۹]/g,function(c){return String.fromCharCode((c.charCodeAt(0)&0x000F)+48);});}
function esc(s){return toLatin(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function ea(s){return esc(s);}
function findQ(id){var all=allStages();for(var i=0;i<all.length;i++){for(var j=0;j<all[i].questions.length;j++){if(all[i].questions[j].id===id)return all[i].questions[j];}}return null;}
function ans(id){var a=answers[id];if(a&&typeof a==="object"&&a.sel)return a;a={sel:[],extra:""};answers[id]=a;return a;}
function L(){return state.lang;}
function rtl(){return L()==="ar";}
function ni(which){if(which==="next")return rtl()?IC.al:IC.ar;return rtl()?IC.ar:IC.al;}
function fmtDate(iso){try{return toLatin(new Date(iso).toLocaleDateString("ar-EG",{year:"numeric",month:"short",day:"numeric"}));}catch(e){return iso;}}
function ph(q){return q.placeholder?ea(q.placeholder[L()]):""}

/* Plain-text answer items (no HTML) — shared by the dashboard view and the Word
   export, so both render identical content for every field type. Returns []. */
function answerItems(q,a,lg){
  if(a==null)return [];
  if(Array.isArray(a)){
    return a.map(function(x){
      if(x&&typeof x==="object"){
        if("platform"in x||"handle"in x){
          var pd=SOCIAL_PLATFORMS.find(function(p){return p.id===x.platform;});
          var pn=pd?(pd[lg]||pd.en):(x.platform||"");
          var h=(x.handle||"").trim();
          return pn||h?(pn+(h?" — "+h:"")):"";
        }
        if("code"in x||"num"in x)return ((x.code||"")+" "+(x.num||"")).trim();
        var s=(x.a||"").trim(),b=(x.b||"").trim();
        return s||b?(s+(s&&b?" — ":"")+b):"";
      }
      return String(x==null?"":x).trim();
    }).filter(Boolean);
  }
  if(typeof a==="string")return a.trim()?[a.trim()]:[];
  var parts=[];
  (a.sel||[]).forEach(function(v){
    if(v==="other"){var ol=q&&q.otherLabel?q.otherLabel[lg]:(lg==="ar"?"أخرى":"Other");parts.push(a.extra?ol+": "+a.extra:ol);}
    else if(q&&q.type==="suggest"){var ds=DIFF_SUGG[lg]&&DIFF_SUGG[lg][v];if(ds)parts.push(ds);}
    else{var o=q&&q.options&&q.options[v];if(o)parts.push(o[lg]||o.ar||"");}
  });
  if(q&&q.type==="suggest"&&a.extra)parts.push(a.extra);
  return parts.filter(Boolean);
}

/* ── controls renderer ─────────────────────────────────────────── */
function ctrl(q){
  var t=q.type, id=q.id;

  if(t==="text"||t==="number"||t==="url"||t==="email"){
    var v=typeof answers[id]==="string"?answers[id]:"";
    var extra=t==="number"?' inputmode="numeric" data-digits="1"':'';
    return '<input class="inp" type="'+(t==="url"?"url":t==="email"?"email":"text")+'"'+extra+' data-q="'+id+'" value="'+ea(v)+'" placeholder="'+ph(q)+'">';
  }
  if(t==="textarea"||t==="multitext"){
    var v2=typeof answers[id]==="string"?answers[id]:"";
    return '<textarea class="inp" rows="3" data-q="'+id+'" placeholder="'+ph(q)+'">'+esc(v2)+'</textarea>';
  }
  if(t==="phone"){
    var pd=Array.isArray(answers[id])?answers[id]:[{code:"+966",num:""}];
    var rows=pd.map(function(r,i){
      return '<div class="addrow">'
        +'<div class="phone-code"><input class="inp" data-q="'+id+'" data-field="phone" data-index="'+i+'" data-key="code" value="'+ea(r.code||"")+'" placeholder="+966"></div>'
        +'<div class="phone-num"><input class="inp" data-q="'+id+'" data-field="phone" data-index="'+i+'" data-key="num" value="'+ea(r.num||"")+'" placeholder="'+(L()==="ar"?"رقم الهاتف":"Phone number")+'"></div>'
        +(i>0?'<button class="delbtn" data-action="delField" data-q="'+id+'" data-index="'+i+'" aria-label="'+(L()==="ar"?"حذف":"Remove")+'">&times;</button>':'')
      +'</div>';
    }).join("");
    return '<div class="addwrap phone-wrap">'+rows+'</div><button class="addbtn" data-action="addField" data-q="'+id+'" data-ftype="phone">'+T[L()].add+'</button>';
  }
  if(t==="multiadd"){
    var arr=Array.isArray(answers[id])?answers[id]:[""];if(!arr.length)arr=[""];
    var rows2=arr.map(function(v,i){return '<div class="addrow"><input class="inp" data-q="'+id+'" data-field="multi" data-index="'+i+'" value="'+ea(v)+'" placeholder="'+ph(q)+'">'+(i>0?'<button class="delbtn" data-action="delField" data-q="'+id+'" data-index="'+i+'" aria-label="'+(L()==="ar"?"حذف":"Remove")+'">&times;</button>':'')+'</div>';}).join("");
    return '<div class="addwrap">'+rows2+'</div><button class="addbtn" data-action="addField" data-q="'+id+'" data-ftype="multi">'+T[L()].add+'</button>';
  }
  if(t==="multipair"){
    var arr3=Array.isArray(answers[id])?answers[id]:[{a:"",b:""}];if(!arr3.length)arr3=[{a:"",b:""}];
    var pa=q.pair.a[L()],pb=q.pair.b[L()];
    var rows3=arr3.map(function(o,i){
      return '<div class="addrow">'
        +'<input class="inp inp-sm" data-q="'+id+'" data-field="pair" data-index="'+i+'" data-key="a" value="'+ea(o&&o.a||"")+'" placeholder="'+ea(pa)+'">'
        +'<input class="inp inp-lg" data-q="'+id+'" data-field="pair" data-index="'+i+'" data-key="b" value="'+ea(o&&o.b||"")+'" placeholder="'+ea(pb)+'">'
        +(i>0?'<button class="delbtn" data-action="delField" data-q="'+id+'" data-index="'+i+'" aria-label="'+(L()==="ar"?"حذف":"Remove")+'">&times;</button>':'')
      +'</div>';
    }).join("");
    return '<div class="addwrap">'+rows3+'</div><button class="addbtn" data-action="addField" data-q="'+id+'" data-ftype="pair">'+T[L()].add+'</button>';
  }
  if(t==="file"){
    var fn=typeof answers[id]==="string"?answers[id]:"";
    return '<label class="filez">'+IC.doc+'<span>'+(fn?esc(fn):T[L()].fileHint)+'</span><input type="file" data-q="'+id+'" hidden></label>';
  }
  if(t==="suggest"){
    var a2=ans(id);
    var chips=DIFF_SUGG[L()].map(function(s,i){
      var used=a2.sel.indexOf(i)>-1;
      return '<span class="suggest-chip'+(used?" used":"")+'" data-action="sugg" data-q="'+id+'" data-val="'+i+'">'+esc(s)+'</span>';
    }).join("");
    var textarea='<textarea class="inp" rows="2" data-q="'+id+'" data-field="extra" placeholder="'+ph(q)+'">'+esc(a2.extra||"")+'</textarea>';
    return '<div class="suggest-label">'+(L()==="ar"?"اختر من المقترحات أو اكتب بنفسك:":"Select from suggestions or write your own:")+'</div><div class="suggest-strip">'+chips+'</div>'+textarea;
  }

  if(t==="socialpair"){
    var arr=Array.isArray(answers[id])?answers[id]:[{platform:"",handle:""}];
    if(!arr.length)arr=[{platform:"",handle:""}];
    var chev='<svg class="sp-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>';
    var phText='<span class="sp-phtext">'+(L()==="ar"?"المنصة":"Platform")+'</span>';
    var rows=arr.map(function(row,i){
      row=row||{platform:"",handle:""};
      var pdata=SOCIAL_PLATFORMS.find(function(p){return p.id===row.platform;})||null;
      var key=id+"#"+i, open=state.spOpen===key;
      var trigIcon=pdata?pdata.icon:phText;
      var trigLabel=pdata?pdata[L()]:(L()==="ar"?"اختر المنصة":"Choose platform");
      var menu=open?'<div class="sp-menu" role="listbox">'+SOCIAL_PLATFORMS.map(function(p){
        return '<button type="button" class="sp-opt'+(row.platform===p.id?" on":"")+'" data-action="spPick" data-q="'+id+'" data-index="'+i+'" data-platform="'+p.id+'" role="option" aria-selected="'+(row.platform===p.id?"true":"false")+'" title="'+ea(p[L()])+'" aria-label="'+ea(p[L()])+'">'+p.icon+'</button>';
      }).join("")+'</div>':'';
      return '<div class="addrow sp-row">'
        +'<div class="sp-psw">'
        +'<button type="button" class="sp-trig'+(open?" open":"")+'" data-action="spToggle" data-q="'+id+'" data-index="'+i+'" aria-haspopup="listbox" aria-expanded="'+(open?"true":"false")+'" aria-label="'+ea(trigLabel)+'">'+trigIcon+chev+'</button>'
        +menu
        +'</div>'
        +'<input class="inp sp-handle" dir="auto" data-q="'+id+'" data-field="sphandle" data-index="'+i+'" value="'+ea(row.handle||"")+'" placeholder="'+(L()==="ar"?"@اسم_الحساب أو الرابط":"@handle or URL")+'">'
        +(i>0?'<button class="delbtn" data-action="delField" data-q="'+id+'" data-index="'+i+'" aria-label="'+(L()==="ar"?"حذف":"Remove")+'">&times;</button>':'')
      +'</div>';
    }).join("");
    return '<div class="addwrap sp-wrap">'+rows+'</div><button class="addbtn" data-action="addField" data-q="'+id+'" data-ftype="socialpair">'+T[L()].add+'</button>';
  }

  /* generic multi/scale/adj */
  var a3=ans(id);
  var otherTxt=q.otherLabel?q.otherLabel[L()]:(L()==="ar"?"أخرى":"Other");
  var html="";
  if(t==="scale"){
    html='<div class="scale" role="radiogroup">';
    q.options.forEach(function(o,i){var sel=a3.sel.indexOf(i)>-1;html+='<div class="sopt'+(sel?" sel":"")+'" role="radio" tabindex="0" aria-checked="'+(sel?"true":"false")+'" data-action="opt" data-q="'+id+'" data-val="'+i+'">'+o[L()]+'</div>';});
    html+='</div>';
  } else if(q.adj){
    html='<div class="adjwrap" role="group">';
    q.options.forEach(function(o,i){var sel=a3.sel.indexOf(i)>-1;html+='<div class="adj'+(sel?" sel":"")+'" role="checkbox" tabindex="0" aria-checked="'+(sel?"true":"false")+'" data-action="opt" data-q="'+id+'" data-val="'+i+'">'+o[L()]+'</div>';});
    if(q.other){var selO=a3.sel.indexOf("other")>-1;html+='<div class="adj'+(selO?" sel":"")+'" role="checkbox" tabindex="0" aria-checked="'+(selO?"true":"false")+'" data-action="opt" data-q="'+id+'" data-val="other">'+otherTxt+'</div>';}
    html+='</div><div class="adjcount">'+T[L()].adj(a3.sel.length)+'</div>';
    if(q.other&&a3.sel.indexOf("other")>-1)html+='<input class="inp" data-q="'+id+'" data-field="extra" value="'+ea(a3.extra||"")+'" placeholder="'+ea(L()==="ar"?"اكتب صفة أخرى…":"Type another word…")+'">';
  } else {
    html='<div class="opts" role="group">';
    q.options.forEach(function(o,i){var sel=a3.sel.indexOf(i)>-1;html+='<div class="opt'+(sel?" sel":"")+'" role="checkbox" tabindex="0" aria-checked="'+(sel?"true":"false")+'" data-action="opt" data-q="'+id+'" data-val="'+i+'"><span class="box" aria-hidden="true">'+IC.check+'</span><span>'+o[L()]+'</span></div>';});
    if(q.other){var selO2=a3.sel.indexOf("other")>-1;html+='<div class="opt'+(selO2?" sel":"")+'" role="checkbox" tabindex="0" aria-checked="'+(selO2?"true":"false")+'" data-action="opt" data-q="'+id+'" data-val="other"><span class="box" aria-hidden="true">'+IC.check+'</span><span>'+otherTxt+'</span></div>';}
    html+='</div>';
    if(q.other&&a3.sel.indexOf("other")>-1)html+='<input class="inp" data-q="'+id+'" data-field="extra" value="'+ea(a3.extra||"")+'" placeholder="'+ea(T[L()].otherPh)+'">';
  }
  return html;
}

function findSub(id){var ss=state.subs||[];for(var i=0;i<ss.length;i++)if(ss[i].id===id)return ss[i];return null;}
function subSnap(s){return (s.answers&&s.answers.__stages)?s.answers.__stages:allStages();}
function vDetail(){
  var s=findSub(state.curSub);

  var lg=s.lang||"ar",ar=(lg==="ar"),dir=ar?"rtl":"ltr";

  }
  var snap=subSnap(s);
  function qById(id){for(var a=0;a<snap.length;a++){for(var b=0;b<snap[a].questions.length;b++){if(snap[a].questions[b].id===id)return snap[a].questions[b];}}return null;}
  function itemsFor(id){var qq=qById(id);return qq?answerItems(qq,s.answers[id],lg):[];}

  function rowHtml(q){
    var items=answerItems(q,s.answers[q.id],lg);
    var g=q.golden||GOLDEN[q.id], aHtml;

    else aHtml=items.map(function(p){return esc(p);}).join("<br>");
    return '<div class="brow'+(g?" gold":"")+'"><div class="brow-q">'+esc((q.q&&(q.q[lg]||q.q.ar))||"")+(g?' <span class="gbadge">'+(ar?"محوري":"Key")+'</span>':"")+'</div><div class="brow-a">'+aHtml+'</div></div>';
  }
  function gapBlock(){
    function col(id,cls,title){
      var items=itemsFor(id);
      var tags=items.length?items.map(function(p){return '<span class="atag '+cls+'">'+esc(p)+'</span>';}).join(""):'<span class="b-empty">—</span>';
      return '<div class="gapcol"><div class="h">'+esc(title)+'</div><div class="vtags">'+tags+'</div></div>';

    return '<div class="gapbox"><div class="gaptitle">'+(ar?"الفجوة الاستراتيجية":"Strategic gap")+'</div><div class="gap">'+col("s5_current","",T[lg].cur)+'<div class="gaparrow">'+(ar?IC.al:IC.ar)+'</div>'+col("s5_desired","d",T[lg].des)+'</div></div>';

      return rowHtml(q);
    }).join("");
    var inner=(hasGap?gapBlock():"")+rows;
    if(!inner)return "";
    num++;
    return '<section class="bsection"><div class="bsection-h"><span class="bnum">'+num+'</span><span>'+esc((st.title&&(st.title[lg]||st.title.ar))||"")+'</span></div><div class="bsection-body">'+inner+'</div></section>';
  }).join("");

  var subBits=[itemsFor("s1_activity").join("، "),itemsFor("s1_year").join(""),itemsFor("s1_team").join("")].filter(Boolean);

    return '<div class="cinfo"><div class="cinfo-k">'+esc((qq.q&&(qq.q[lg]||qq.q.ar))||"")+'</div><div class="cinfo-v">'+items.map(function(p){return esc(p);}).join("<br>")+'</div></div>';
  }).filter(Boolean).join("");
  var contactCard=contactRows?'<div class="contact-card">'+contactRows+'</div>':"";

    ?'<span class="pill parch">'+(ar?"مؤرشف":"Archived")+'</span>'
    :'<span class="pill '+(s.status==="new"?"pnew":"prev2")+'">'+(s.status==="new"?(ar?"جديد":"New"):(ar?"تمت المراجعة":"Reviewed"))+'</span>';
  var archBtn=isArch
    ?'<button class="ghost sm" data-action="restoreSub" data-id="'+s.id+'">'+IC.restore+'<span>'+(ar?"استعادة":"Restore")+'</span></button>'
    :'<button class="ghost sm" data-action="archiveSub" data-id="'+s.id+'">'+IC.archive+'<span>'+(ar?"أرشفة":"Archive")+'</span></button>';
  var bar='<div class="detail-bar"><button class="ghost sm" data-action="backList">'+ni("prev")+'<span>'+(ar?"رجوع":"Back")+'</span></button><div class="detail-actions">'+archBtn+'<button class="ghost sm" data-action="printSub">'+IC.print+'<span>'+(ar?"طباعة / PDF":"Print / PDF")+'</span></button><button class="cta sm" data-action="dlWord">'+IC.dl+'<span>'+(ar?"تحميل Word":"Download Word")+'</span></button></div></div>';
  var cover='<div class="bcover"><div class="bcover-eyebrow"><span class="dot"></span><span>'+(ar?"موجز اكتشاف العلامة":"Brand Discovery Brief")+'</span></div><h2 class="bcover-brand">'+esc(s.brand)+'</h2>'+subline+'<div class="bcover-meta">'+fmtDate(s.date||s.created_at)+' <span class="bdot">·</span> '+(ar?"العربية":"English")+' <span class="bdot">·</span> '+statusPill+'</div></div>';

  return topbar("admin")+'<div class="wrapw">'+bar+'<div class="brief" dir="'+dir+'">'+cover+contactCard+sections+'</div></div>';

function wEsc(v){return toLatin(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function buildWordHtml(s){
  var lg=s.lang||"ar",ar=(lg==="ar"),dir=ar?"rtl":"ltr",al=ar?"right":"left";
  var snap=subSnap(s);
  var AC="#0A57FF",INK="#16161A",MUT="#6B6B72",LINE="#E2E2DD",SOFT="#EEF3FF";
  function wDate(iso){try{return new Date(iso).toLocaleDateString(ar?"ar-EG":"en-GB",{year:"numeric",month:"long",day:"numeric"});}catch(e){return iso||"";}}
  function qById(id){for(var a=0;a<snap.length;a++){for(var b=0;b<snap[a].questions.length;b++){if(snap[a].questions[b].id===id)return snap[a].questions[b];}}return null;}
  function itemsFor(id){var qq=qById(id);return qq?answerItems(qq,s.answers[id],lg):[];}
  function wVal(q){
    var items=answerItems(q,s.answers[q.id],lg);
    if(!items.length)return '<span style="color:'+MUT+'">—</span>';
    if(q.type==="multi"||q.type==="scale"||q.adj)return items.map(function(p){return '&#8226;&nbsp;'+wEsc(p);}).join('<br>');
    return items.map(function(p){return wEsc(p).replace(/\r?\n/g,"<br>");}).join("<br>");
  }
  var L_brief=ar?"موجز اكتشاف العلامة التجارية":"Brand Discovery Brief";
  var L_agency=ar?"وكالة ربيز":"Rabeez";
  var L_prep=ar?"أُعدّ بواسطة وكالة ربيز":"Prepared by Rabeez";
  var L_contact=ar?"بيانات التواصل":"Contact details";
  var logo=LOGO_PRINT[ar?"ar":"en"];

  /* ── cover ── */
  var act=toLatin(itemsFor("s1_activity").join(ar?"، ":", "));
  var yr=toLatin(itemsFor("s1_year").join(""));
  var team=toLatin(itemsFor("s1_team").join(ar?"، ":", "));
  var L_filled=ar?"تمّ تعبئة هذا النموذج من قِبَل العميل مباشرةً":"This form was completed directly by the client";
  var L_activity=ar?"المجال":"Industry";var L_year=ar?"سنة التأسيس":"Founded";var L_team=ar?"عدد الموظفين":"Team size";
  var infoCells=[];
  if(act)infoCells.push({label:L_activity,val:act});
  if(yr)infoCells.push({label:L_year,val:yr});
  if(team)infoCells.push({label:L_team,val:team});
  function infoBox(){
    if(!infoCells.length)return "";
    var cells=infoCells.map(function(c,i){
      var sep=(infoCells.length===3&&i===1)?';border-left:1px solid '+LINE+';border-right:1px solid '+LINE:'';
      return '<td style="padding:10px 30px;text-align:center'+sep+'">'
        +'<div style="color:'+MUT+';font-size:8.5pt;margin-bottom:4px">'+wEsc(c.label)+'</div>'
        +'<div style="font-weight:bold;color:'+INK+';font-size:12pt">'+wEsc(c.val)+'</div>'
        +'</td>';
    }).join("");
    return '<table style="margin:0 auto;border-collapse:collapse;background:#F5F8FF;border:1px solid '+LINE+'"><tr>'+cells+'</tr></table>';
  }
  var cover=''
    +'<div style="text-align:center;padding-top:110px;padding-bottom:80px">'
    +(logo?'<img src="'+logo+'" style="height:48px;width:auto" alt="Rabeez"><div style="height:50px"></div>':'')
    +'<div style="font-size:11pt;color:'+AC+';font-weight:bold;margin-bottom:26px">'+wEsc(L_brief)+'</div>'
    +'<div style="font-size:40pt;font-weight:bold;color:'+INK+';line-height:1.2;margin-bottom:34px">'+wEsc(s.brand)+'</div>'
    +(infoCells.length?infoBox()+'<div style="height:42px"></div>':'<div style="height:10px"></div>')
    +'<div style="border-top:2px solid '+AC+';width:56px;margin-left:auto;margin-right:auto"></div>'
    +'<div style="height:22px"></div>'
    +'<div style="font-size:10.5pt;font-weight:bold;color:'+INK+'">'+wEsc(L_filled)+'</div>'
    +'<div style="height:16px"></div>'
    +'<div style="font-size:10pt;color:'+MUT+'">'+wEsc(wDate(s.date||s.created_at))+'&nbsp;&nbsp;·&nbsp;&nbsp;'+(ar?"العربية":"English")+'</div>'
    +'<div style="height:6px"></div>'
    +'<div style="font-size:10pt;color:'+MUT+'">'+wEsc(L_prep)+'</div>'
    +'</div>';

  /* ── contact ── */
  var contactRows=CONTACT_IDS.map(function(id){
    var qq=qById(id);if(!qq)return "";var items=answerItems(qq,s.answers[id],lg);if(!items.length)return "";
    return '<tr><td style="width:32%;vertical-align:top;padding:7px 12px;border-bottom:1px solid '+LINE+';color:'+MUT+';font-weight:bold">'+wEsc((qq.q&&(qq.q[lg]||qq.q.ar))||"")+'</td>'
      +'<td style="vertical-align:top;padding:7px 12px;border-bottom:1px solid '+LINE+';color:'+INK+'">'+items.map(wEsc).join("<br>")+'</td></tr>';
  }).filter(Boolean).join("");
  var contact=contactRows?'<div style="font-size:13pt;font-weight:bold;color:'+AC+';margin:0 0 8px">'+wEsc(L_contact)+'</div><table dir="'+dir+'" width="100%" style="border-collapse:collapse;border-top:2px solid '+AC+';margin:0 0 22px;font-size:11pt">'+contactRows+'</table>':"";

  /* ── gap ── */
  function gapTable(){
    function cell(id){var items=itemsFor(id);return items.length?items.map(wEsc).join("<br>"):'<span style="color:'+MUT+'">—</span>';}
    return '<table dir="'+dir+'" width="100%" style="border-collapse:collapse;margin:4px 0 16px;font-size:11pt">'
      +'<tr><td width="50%" style="background:'+SOFT+';border:1px solid '+AC+';padding:8px 12px;color:'+AC+';font-weight:bold;text-align:center">'+wEsc(T[lg].cur)+'</td>'
      +'<td width="50%" style="background:'+SOFT+';border:1px solid '+AC+';padding:8px 12px;color:'+AC+';font-weight:bold;text-align:center">'+wEsc(T[lg].des)+'</td></tr>'
      +'<tr><td style="border:1px solid '+LINE+';padding:10px 12px;vertical-align:top;color:'+INK+'">'+cell("s5_current")+'</td>'
      +'<td style="border:1px solid '+LINE+';padding:10px 12px;vertical-align:top;color:'+INK+'">'+cell("s5_desired")+'</td></tr></table>';
  }

  /* ── sections ── */
  var num=0;
  var sections=snap.map(function(st){
    var hasGap=st.questions.some(function(q){return q.id==="s5_current";});
    var rows=st.questions.map(function(q){
      if(q.type==="subheading"||HEADER_IDS[q.id]||CONTACT_SET[q.id]||q.id==="s5_current"||q.id==="s5_desired")return "";
      var g=q.golden||GOLDEN[q.id];
      var qcell='<td style="width:34%;vertical-align:top;padding:8px 12px;border-bottom:1px solid '+LINE+';color:'+(g?AC:MUT)+';font-weight:bold">'+(g?'&#9733; ':'')+wEsc((q.q&&(q.q[lg]||q.q.ar))||"")+'</td>';
      var acell='<td style="vertical-align:top;padding:8px 12px;border-bottom:1px solid '+LINE+';color:'+INK+'">'+wVal(q)+'</td>';
      return '<tr'+(g?' style="background:'+SOFT+'"':'')+'>'+qcell+acell+'</tr>';
    }).join("");
    var body=(hasGap?gapTable():"")+(rows?'<table dir="'+dir+'" width="100%" style="border-collapse:collapse;font-size:11pt">'+rows+'</table>':"");
    if(!body)return "";
    num++;
    return '<div style="page-break-inside:avoid"><div style="font-size:14pt;font-weight:bold;color:'+AC+';border-bottom:2px solid '+AC+';padding-bottom:5px;margin:24px 0 12px">'+num+'.&nbsp;&nbsp;'+wEsc((st.title&&(st.title[lg]||st.title.ar))||"")+'</div></div>'+body;
  }).join("");

  var brk='<br clear="all" style="mso-special-character:line-break;page-break-before:always">';
  return '<!DOCTYPE html><html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8">'
    +'<title>'+wEsc(s.brand)+' — '+wEsc(L_brief)+'</title>'
    +'<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom></w:WordDocument></xml><![endif]-->'
    +'<style>@page{size:A4;margin:2.2cm 2cm}body{font-family:"Segoe UI",Arial,sans-serif;color:'+INK+';line-height:1.6;font-size:11pt}table{table-layout:fixed}td{word-wrap:break-word;overflow-wrap:break-word}</style>'
    +'</head><body dir="'+dir+'" style="text-align:'+al+'">'
    +cover+brk+contact+sections
    +'</body></html>';
}
function downloadWord(id){

/* ── render ────────────────────────────────────────────────────── */
function applyDir(){
  var isAdmin=state.view==="admin"||state.view==="adminDetail"||state.view==="login";
  document.documentElement.dir=(!isAdmin&&state.lang==="en")?"ltr":"rtl";
  document.documentElement.lang=isAdmin?"ar":state.lang;
}
/* Walk text nodes (and select attributes used by screen readers) and normalize
   Arabic-Indic / Persian digits to Latin 0-9. Cheap — only rewrites nodes that
   actually contain a non-Latin digit. */
function normalizeDigitsInDom(root){
  var rx=/[٠-٩۰-۹]/;
  var sub=function(c){return String.fromCharCode((c.charCodeAt(0)&0x000F)+48);};
  var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null,false);
  var n;while((n=w.nextNode())){if(rx.test(n.nodeValue))n.nodeValue=n.nodeValue.replace(/[٠-٩۰-۹]/g,sub);}
  var nodes=root.querySelectorAll("[aria-label],[title],[placeholder]");
  for(var i=0;i<nodes.length;i++){
    var el=nodes[i];
    ["aria-label","title","placeholder"].forEach(function(a){
      var v=el.getAttribute(a);if(v&&rx.test(v))el.setAttribute(a,v.replace(/[٠-٩۰-۹]/g,sub));
    });
  }
}
function render(){
  applyDir();
  var html;
  if(state.generating)html=vGen();
  else if(state.view==="landing")html=vLanding();
  else if(state.view==="form")html=vStage();
  else if(state.view==="thanks")html=vThanks();
  else if(state.view==="login")html=vLogin();
  else if(state.view==="admin")html=vAdmin();
  else if(state.view==="adminDetail")html=vDetail();
  var root=document.getElementById("app");
  root.innerHTML=html;
  /* Platform-wide rule: render every digit as Latin 0-9, regardless of source
     (AI-generated questions, Intl date formatters, hardcoded copy). */
  normalizeDigitsInDom(root);
  if(state.view==="form"&&state.stage!==_lastFocusedStage&&!Object.keys(state.errors||{}).length){
    _lastFocusedStage=state.stage;
    requestAnimationFrame(function(){var h=document.getElementById("stage-heading");if(h)h.focus({preventScroll:true});});
  }
}

/* ── generating animation ──────────────────────────────────────── */
function buildCtrlFromGenerated(q){
  /* Map generated question structure → same ctrl() format */
  if(!q.type)q.type="textarea";
  return q;
}

function mapStages(raw){
  return (raw.stages||[]).map(function(st){
    return {
      _idx: (typeof st._idx==="number")?st._idx:null,
      title: {ar: st.title_ar||"", en: st.title_en||st.title_ar||""},
      questions: (st.questions||[]).map(function(q){
        var out = {
          id: q.id || ("gen_"+Math.random().toString(36).slice(2)),
          q: {ar: q.q_ar||"", en: q.q_en||q.q_ar||""},
          type: q.type || "textarea",
          required: false
        };
        // options
        if((q.type==="multi"||q.type==="scale") && q.options_ar && q.options_ar.length){
          out.options = q.options_ar.map(function(o,i){
            return {ar:o, en:(q.options_en&&q.options_en[i])||o};
          });
        }
        // other option for multi
        if(q.type==="multi" && q.other){
          out.other = true;
          out.otherLabel = {ar:"سبب آخر", en:"Other"};
        }
        // help
        if(q.help_why_ar || q.help_ex_ar){
          out.help = {
            why: {ar:q.help_why_ar||"", en:q.help_why_en||q.help_why_ar||""},
            ex:  {ar:q.help_ex_ar||"",  en:q.help_ex_en||q.help_ex_ar||""}
          };
        }
        if(q.golden){ out.golden=true; GOLDEN[out.id]=1; }
        return out;
      })
    };
  });
}

function updateGenBar(pct){
  var fill=document.getElementById("genFill");
  var pctEl=document.getElementById("genPct");
  if(fill) fill.style.width=Math.round(pct)+"%";
  if(pctEl) pctEl.textContent=T[L()].genPct(Math.round(pct));
}

// Which dynamic-stage indices currently have a request in flight.
var inflight={};

// Re-request a single stage if its slot is empty and nothing is fetching it
// (e.g. the background batch failed for that one stage).
function validate(){
  var st=currentStageData();
  var errs={};
  (st.questions||[]).forEach(function(q){
    if(!q.required)return;
    var a=answers[q.id];
    var empty=(a==null)||(typeof a==="string"&&!a.trim());
    if(empty)errs[q.id]=true;
  });
  return errs;
}

function ensureStage(i){
  if(DYNAMIC_STAGES&&DYNAMIC_STAGES[i]==null&&!inflight[i]) genBatch([i]);
}

// Generate a specific batch of stages (by 0-based index into the dynamic set)
// and drop each result into its DYNAMIC_STAGES slot. Returns the list of
// indices that were successfully filled.
async function genBatch(indices){
  var brandName=typeof answers.s1_name==="string"?answers.s1_name.trim():"";
  var activity=typeof answers.s1_activity==="string"?answers.s1_activity.trim():"";
  var description=typeof answers.s2_desc==="string"?answers.s2_desc.trim():"";
  var filled=[];
  indices.forEach(function(i){inflight[i]=true;});
  try{
    var resp=await fetch("/api/generate",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({brandName:brandName,activity:activity,description:description,lang:L(),only:indices})
    });
    if(!resp.ok) throw new Error("API "+resp.status);
    var mapped=mapStages(await resp.json());
    if(!DYNAMIC_STAGES) DYNAMIC_STAGES=new Array(DYNAMIC_COUNT).fill(null);
    mapped.forEach(function(m,k){
      var i=(m._idx!=null)?m._idx:indices[k];
      if(i!=null&&i>=0&&i<DYNAMIC_COUNT){DYNAMIC_STAGES[i]=m;filled.push(i);}
    });
  }catch(err){
    console.warn("Batch failed:",indices,err.message);
  }
  indices.forEach(function(i){inflight[i]=false;});
  // If the user is sitting on a stage we just filled, refresh it.
  if(state.view==="form"&&!state.generating) render();
  return filled;
}

function startGen(){
  state.generating=true;state.genPct=0;render();
  state.genPct=5; updateGenBar(5);
  var fakeTimer=setInterval(function(){
    if(state.genPct<90){state.genPct+=4;updateGenBar(state.genPct);}
  },350);
  DYNAMIC_STAGES=new Array(DYNAMIC_COUNT).fill(null);
  // Batch 1: just the first dynamic stage, so the user sees questions fast.
  genBatch([0]).then(function(filled){
    clearInterval(fakeTimer);
    updateGenBar(100);
    if(!filled.length){DYNAMIC_STAGES=null;} // total failure → static fallback
    setTimeout(function(){
      state.generating=false;state.stage=3;saveDraft();render();window.scrollTo(0,0);
      // Batch 2: the remaining stages, in the background.
      if(filled.length){
        var rest=[];for(var i=1;i<DYNAMIC_COUNT;i++)rest.push(i);
        genBatch(rest);
      }
    },300);
  });
}

/* ── toggle option ─────────────────────────────────────────────── */
function toggleOpt(qid,raw){
  var q=findQ(qid),a=ans(qid);

  if(q.type==="scale"){a.sel=(a.sel[0]===val)?[]:[val];}
  else{var idx=a.sel.indexOf(val);if(idx>-1)a.sel.splice(idx,1);else{if(q.limit&&a.sel.length>=q.limit[1])return;a.sel.push(val);}}

}

/* ── submit ────────────────────────────────────────────────────── */
async function doSubmit(){
  if(state.submitting)return;            // guard against double submission
  state.submitting=true;state.submitErr="";render();
  var name=(typeof answers.s1_name==="string"&&answers.s1_name.trim())?answers.s1_name.trim():"—";
  var ok=false,detail="";
  try{
    var r=await fetch('/api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({brand:name,lang:state.lang,answers:answers,questions:allStages()})});
    ok=r.ok;
    if(!ok){try{detail=(await r.json()).detail||"";}catch(e){}}
  }catch(e){detail=String(e);}
  state.submitting=false;
  if(!ok){
    state.submitErr=(L()==="ar"?"تعذّر حفظ النموذج، حاول مرة أخرى":"Could not save the form, please try again")+(detail?" — "+detail:"");
    render();return;
  }
  state.submitErr="";
  clearDraft();answers={};state.stage=1;state.view="thanks";render();window.scrollTo(0,0);
}

async function fetchSubs(){
  try{
    var r=await fetch('/api/submissions');
    if(!r.ok)throw new Error();
    var data=await r.json();
    state.subs=Array.isArray(data)?data:[];
  }catch(e){state.subs=[];}

}
/* Move a submission to / out of the archive. Optimistic: update locally, then
   persist via update-status (reused; accepts any status). */
function setSubStatus(id,status){
  var subs=state.subs||[];
  for(var i=0;i<subs.length;i++)if(subs[i].id===id)subs[i].status=status;
  fetch('/api/update-status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id,status:status})}).catch(function(){});
  if(state.view==="adminDetail"){state.view="admin";state.adminTab=(status==="archived")?"archive":"active";}
  render();
}

  }
  else if(act==="submit"){if(state.submitting)return;var errs2=validate();if(Object.keys(errs2).length){state.errors=errs2;render();return;}state.errors={};doSubmit();}
