<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client Brief — Rabeez</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0A0B;--surface:#141416;--surface-2:#1C1C1F;--border:#2A2A2E;
  --accent:#0A57FF;--glow:#0059FF;--cool:#3D7BFF;
  --text:#F5F5F5;--text-2:#9A9A9F;--text-3:#6A6A6F;
  --ok:#5FC08C;--card-radius:16px;
  --font-display:'HT Baybars Display','IBM Plex Sans Arabic',Georgia,serif;
  --font-body:'HT Rakik','IBM Plex Sans Arabic',system-ui,sans-serif;
  color-scheme:dark;
}
@media(prefers-color-scheme:light){
  :root{
    --bg:#F5F5F4;--surface:#FFFFFF;--surface-2:#F0F0EE;--border:#D8D8D4;
    --text:#0A0A0B;--text-2:#5A5A5F;--text-3:#9A9A9F;
    color-scheme:light;
  }
  .logo-img{filter:invert(1);}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-weight:300;line-height:1.75;-webkit-font-smoothing:antialiased}
.ic{width:1em;height:1em;stroke:currentColor;stroke-width:1.75;fill:none;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.12em;flex:0 0 auto}
a{color:inherit;text-decoration:none;cursor:pointer}
button{font-family:var(--font-body)}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* topbar */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 22px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:20;backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:10px}
.logo-img{height:32px;width:auto;display:block}
.sep{width:1px;height:18px;background:var(--border)}
.sub{font-family:var(--font-display);font-weight:300;font-size:.9rem;color:var(--text-2)}
.adminlink{font-size:12px;color:var(--text-2);border:1px solid var(--border);border-radius:999px;padding:6px 14px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;transition:border-color .2s,color .2s}
.adminlink:hover{border-color:var(--accent);color:var(--text)}

/* layout */
.wrap{max-width:640px;margin:0 auto;padding:26px 16px 60px}
.wrapw{max-width:920px;margin:0 auto;padding:26px 16px 60px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--card-radius);overflow:hidden}
.cardbody{padding:24px 22px 26px}

/* progress */
.progwrap{display:flex;align-items:center;gap:12px;margin:0 0 18px}
.prog{flex:1;height:4px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--glow),var(--cool));border-radius:999px;transition:width .4s ease}
.progtext{font-size:11px;color:var(--text-3);white-space:nowrap;font-variant-numeric:tabular-nums}

/* eyebrow + question */
.eyebrow{display:flex;align-items:center;gap:8px;margin-bottom:20px;font-size:11px;color:var(--text-2)}
.dot{width:6px;height:6px;border-radius:999px;background:var(--accent);flex:0 0 auto}
.qblock{padding:16px 0;border-top:1px solid var(--border)}
.qblock:first-of-type{border-top:none;padding-top:2px}
.q{margin:0;font-family:var(--font-display);font-weight:300;font-size:1.2rem;line-height:1.55;color:var(--text)}
.req{color:var(--cool);font-weight:500}
.qmark{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);font-size:13px;font-weight:500;cursor:pointer;margin-inline-start:8px;position:relative;vertical-align:middle;line-height:1;padding:0}
.qmark:hover{border-color:var(--accent);color:var(--text)}
.qmark::after{content:"";position:absolute;inset:-3px;border:1.5px solid var(--accent);border-radius:50%;opacity:0;animation:ring 1.6s ease-out .6s 3}
@keyframes ring{0%{opacity:.55;transform:scale(1)}100%{opacity:0;transform:scale(1.2)}}
.scaffold{margin:8px 0 0;font-size:12px;color:var(--text-3);line-height:1.7}

/* collapsible help */
.collapsible{overflow:hidden;max-height:600px;transition:max-height .25s ease}
.collapsible.closed{max-height:0}
.help{margin-top:10px}
.help-inner{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.help-inner p{margin:0;font-size:13px;line-height:1.75;color:var(--text-2)}
.help-inner p+p{margin-top:8px}
.help-inner b{color:var(--text);font-weight:500}

/* options (multi-select) */
.opts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.opt{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface);cursor:pointer;font-size:14px;color:var(--text);font-weight:300;transition:border-color .2s,background .2s}
.opt:hover{border-color:var(--text-2)}
.opt.sel{border-color:var(--accent);background:var(--surface-2);box-shadow:0 0 26px rgba(0,89,255,.10)}
.box{flex:0 0 auto;width:20px;height:20px;border:1px solid var(--border);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.box .ic{display:none}
.opt.sel .box{border-color:var(--accent)}
.opt.sel .box .ic{display:inline}

/* scale */
.scale{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.sopt{flex:1;min-width:80px;text-align:center;padding:11px 8px;border:1px solid var(--border);border-radius:10px;background:var(--surface);cursor:pointer;font-size:13px;color:var(--text-2);font-weight:300;transition:border-color .2s,background .2s,color .2s}
.sopt:hover{border-color:var(--text-2)}
.sopt.sel{border-color:var(--accent);background:var(--surface-2);color:var(--text)}

/* adjective pills */
.adjwrap{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.adj{padding:8px 14px;border:1px solid var(--border);border-radius:999px;background:var(--surface);cursor:pointer;font-size:13px;color:var(--text-2);font-weight:300;transition:border-color .2s,background .2s,color .2s}
.adj:hover{border-color:var(--text-2)}
.adj.sel{border-color:var(--accent);background:rgba(10,87,255,.12);color:var(--text)}
.adjcount{margin-top:10px;font-size:11px;color:var(--text-3)}

/* inputs */
.inp{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-family:var(--font-body);font-size:14px;font-weight:300;line-height:1.7;resize:vertical;margin-top:14px}
.inp:focus{outline:none;border-color:rgba(10,87,255,.5);box-shadow:0 0 0 3px rgba(0,89,255,.10)}
.inp::placeholder{color:var(--text-3)}
textarea.inp{min-height:84px}

/* phone row */
.phone-row{display:flex;gap:8px;margin-top:14px;flex-wrap:nowrap}
.phone-code{flex:0 0 110px}
.phone-code .inp{margin-top:0}
.phone-num{flex:1}
.phone-num .inp{margin-top:0}

/* file upload */
.filez{margin-top:14px;display:flex;align-items:center;gap:10px;border:1px dashed var(--border);border-radius:10px;padding:14px;color:var(--text-2);cursor:pointer;font-size:13px;transition:border-color .2s}
.filez:hover{border-color:var(--accent)}

/* repeatable add rows */
.addwrap{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.addrow{display:flex;align-items:center;gap:8px;flex-wrap:nowrap}.phone-wrap .addrow{direction:ltr;unicode-bidi:isolate}
.addrow .inp{margin-top:0}
.inp-sm{flex:0 0 33%}
.inp-lg{flex:1}
.delbtn{flex:0 0 38px;height:42px;border:1px solid var(--border);border-radius:10px;background:transparent;color:var(--text-3);font-size:20px;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center}
.delbtn:hover{border-color:var(--text-2);color:var(--text)}
.addbtn{margin-top:10px;background:transparent;border:1px dashed var(--border);color:var(--text-2);border-radius:10px;padding:9px 16px;font-size:13px;cursor:pointer}
.addbtn:hover{border-color:var(--accent);color:var(--text)}

/* suggest strip */
.suggest-strip{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.suggest-chip{padding:7px 13px;border:1px solid var(--border);border-radius:999px;background:var(--surface);cursor:pointer;font-size:13px;color:var(--text-2);transition:border-color .2s,color .2s}
.suggest-chip:hover,.suggest-chip.used{border-color:var(--accent);color:var(--text)}
.suggest-chip.used{background:rgba(10,87,255,.10)}
.suggest-label{margin-top:14px;margin-bottom:6px;font-size:12px;color:var(--text-3)}

/* nav buttons */
.nav{display:flex;align-items:center;justify-content:space-between;margin-top:24px;gap:12px}
.cta{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,#0059FF 0%,#0047cc 100%);color:#fff;border:none;border-radius:10px;padding:12px 22px;font-weight:500;font-size:14px;cursor:pointer;box-shadow:0 4px 16px rgba(0,89,255,.20);transition:transform .15s}
.cta:hover{transform:translateY(-1px)}
.ghost{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--border);color:var(--text-2);border-radius:10px;padding:11px 18px;font-size:13px;font-weight:300;cursor:pointer;transition:border-color .2s,color .2s}
.ghost:hover{border-color:var(--text-2);color:var(--text)}
.ghost.sm{padding:8px 14px;font-size:12px}
.ghostcta{background:transparent;color:var(--text);border:1px solid var(--border);box-shadow:none}
.ghostcta:hover{border-color:var(--accent)}
.savenote{margin-top:14px;text-align:center;font-size:11px;color:var(--text-3)}

/* landing */
.land{text-align:center;padding:42px 8px 16px}
.land-logo{margin:0 auto 22px;display:flex;justify-content:center}
.land-logo img{height:44px;width:auto}
.land-title{font-family:var(--font-display);font-weight:700;font-size:2rem;margin:0 0 10px;color:var(--text);animation:titlePulse 0.65s ease-out 0.4s 2}@keyframes titlePulse{0%,100%{text-shadow:none}50%{text-shadow:0 0 20px rgba(0,89,255,.6),0 0 40px rgba(0,89,255,.25)}}
.land-tag{margin:0 auto 28px;max-width:440px;font-size:14px;color:var(--text-2);line-height:1.8}
.land-prompt{font-size:13px;color:var(--text-3);margin:0 0 14px}
.langrow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.land-foot{margin-top:36px;font-size:11px;color:var(--text-3);line-height:1.7}
.resume-card{max-width:460px;margin:0 auto 26px;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:16px 18px;text-align:start}
.resume-card h4{margin:0 0 4px;font-family:var(--font-display);font-weight:500;font-size:15px;color:var(--text)}
.resume-card p{margin:0 0 12px;font-size:13px;color:var(--text-2)}
.resume-card .row{display:flex;gap:10px;flex-wrap:wrap}

/* generating screen */
.gen{text-align:center;padding:60px 16px}
.gen h2{font-family:var(--font-display);font-weight:300;font-size:1.3rem;margin:18px 0 8px}
.gen p{font-size:13px;color:var(--text-2);margin:0 0 24px}
.gen-prog{max-width:320px;margin:0 auto;height:4px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.gen-prog-fill{height:100%;background:linear-gradient(90deg,var(--glow),var(--cool));border-radius:999px;transition:width .3s ease}
.gen-pct{margin-top:10px;font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums}
.spinner{width:38px;height:38px;border:2px solid var(--surface-2);border-top-color:var(--accent);border-radius:50%;margin:0 auto;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* thanks */
.thanks{text-align:center;padding:54px 16px}
.thanks-ic{width:58px;height:58px;border-radius:50%;background:rgba(95,192,140,.12);border:1px solid rgba(95,192,140,.3);color:var(--ok);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:26px}
.thanks h1{font-family:var(--font-display);font-weight:300;font-size:1.5rem;margin:0 0 10px}
.thanks p{font-size:14px;color:var(--text-2);margin:0 0 26px}
.navc{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

/* login */
.login{max-width:360px;margin:80px auto;padding:0 16px}
.login-logo{display:flex;justify-content:center;margin-bottom:28px}
.login-logo img{height:36px}
.login-card{border:1px solid var(--border);background:var(--surface);border-radius:var(--card-radius);padding:28px 26px}
.login-card h2{font-family:var(--font-display);font-weight:300;font-size:1.2rem;margin:0 0 20px;text-align:center}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;color:var(--text-2);margin-bottom:6px}
.field .inp{margin-top:0}
.login-err{font-size:13px;color:#FF5252;margin-top:12px;text-align:center}

/* admin */
.stats{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.stat{flex:1;min-width:140px;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:16px 18px}
.stat .n{font-family:var(--font-display);font-weight:700;font-size:1.9rem;color:var(--text);font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--text-2);margin-top:2px}
.subcard{display:flex;align-items:center;gap:14px;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:16px 18px;margin-bottom:10px;transition:border-color .2s}
.subcard:hover{border-color:var(--text-2)}
.subinfo{flex:1;min-width:0}
.subname{font-family:var(--font-display);font-weight:500;font-size:15px;color:var(--text)}
.submeta{font-size:12px;color:var(--text-2);margin-top:3px}
.pill{font-size:11px;padding:4px 11px;border-radius:999px;white-space:nowrap}
.pnew{color:var(--cool);background:rgba(10,87,255,.14);border:1px solid rgba(10,87,255,.28)}
.prev2{color:var(--text-2);background:var(--surface-2);border:1px solid var(--border)}
.empty{border:1px dashed var(--border);border-radius:12px;padding:40px;text-align:center;color:var(--text-3);font-size:14px}
.detail-top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.summary{border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:18px 20px;margin-bottom:14px}
.summary h2{font-family:var(--font-display);font-weight:500;font-size:1.3rem;margin:0 0 6px;color:var(--text)}
.summary .meta{font-size:12px;color:var(--text-2)}
.gap{display:flex;gap:12px;margin:16px 0 0;flex-wrap:wrap}
.gapcol{flex:1;min-width:160px;border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:var(--surface-2)}
.gapcol .h{font-size:11px;color:var(--text-3);margin-bottom:8px}
.atag{display:inline-block;font-size:12px;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:4px 11px;margin:0 0 6px 6px}
.atag.d{border-color:rgba(10,87,255,.4);color:var(--cool)}
.group{margin-top:18px}
.group-h{font-family:var(--font-display);font-weight:300;font-size:12px;color:var(--text-2);letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.kv{padding:11px 0;border-bottom:1px solid var(--surface-2)}
.kv:last-child{border-bottom:none}
.kv .k{font-size:12px;color:var(--text-3);margin-bottom:3px;display:flex;align-items:center;gap:8px}
.kv .v{font-size:14px;color:var(--text);line-height:1.7;white-space:pre-line}
.kv.gold{border-inline-start:2px solid var(--accent);padding-inline-start:12px}
.gbadge{font-size:10px;color:var(--cool);background:rgba(10,87,255,.14);border:1px solid rgba(10,87,255,.28);padding:1px 7px;border-radius:999px}

/* a11y */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(max-width:560px){.cardbody{padding:18px 15px 20px}.q{font-size:1.1rem}.land-title{font-size:1.35rem}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ── dynamic stages (set after generation) ── */
var DYNAMIC_STAGES=null; // null = not yet generated, [] = fallback

function allStages(){
  var base=STAGES.slice(0,2); // stages 1-2 always static
  var rest=DYNAMIC_STAGES||STAGES.slice(2); // generated or fallback
  return base.concat(rest);
}

function totalStages(){return allStages().length;}
function currentStageData(){return allStages()[state.stage-1];}

/* ── state ─────────────────────────────────────────────────────── */
var state={lang:"ar",view:"landing",stage:1,genPct:0,genTimer:null,curSub:null,loginErr:""};
var answers={};

/* ── storage ───────────────────────────────────────────────────── */
function saveDraft(){try{localStorage.setItem(LS_DRAFT,JSON.stringify({lang:state.lang,stage:state.stage,answers:answers}));}catch(e){}}
function loadDraft(){try{var d=JSON.parse(localStorage.getItem(LS_DRAFT)||"null");if(d){state.lang=d.lang||"ar";state.stage=d.stage||1;answers=d.answers||{};}}catch(e){}}
function hasDraft(){try{var d=JSON.parse(localStorage.getItem(LS_DRAFT)||"null");return !!(d&&d.answers&&Object.keys(d.answers).length);}catch(e){return false;}}
function clearDraft(){try{localStorage.removeItem(LS_DRAFT);}catch(e){}}
function getSubs(){try{return JSON.parse(localStorage.getItem(LS_SUBS)||"[]");}catch(e){return [];}}
function setSubs(s){try{localStorage.setItem(LS_SUBS,JSON.stringify(s));}catch(e){}}
function isAuth(){try{return localStorage.getItem(LS_AUTH)==="1";}catch(e){return false;}}
function setAuth(v){try{localStorage.setItem(LS_AUTH,v?"1":"");}catch(e){}}

/* ── helpers ───────────────────────────────────────────────────── */
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function ea(s){return esc(s);}
function findQ(id){var all=allStages();for(var i=0;i<all.length;i++){for(var j=0;j<all[i].questions.length;j++){if(all[i].questions[j].id===id)return all[i].questions[j];}}return null;}
function ans(id){var a=answers[id];if(a&&typeof a==="object"&&a.sel)return a;a={sel:[],extra:""};answers[id]=a;return a;}
function L(){return state.lang;}
function rtl(){return L()==="ar";}
function ni(which){if(which==="next")return rtl()?IC.al:IC.ar;return rtl()?IC.ar:IC.al;}
function fmtDate(iso){try{return new Date(iso).toLocaleDateString("ar-EG",{year:"numeric",month:"short",day:"numeric"});}catch(e){return iso;}}
function ph(q){return q.placeholder?ea(q.placeholder[L()]):""}

function fmt(q,a,lg){
  if(a==null)return "—";
  if(Array.isArray(a)){
    var f=a.map(function(x){
      if(x&&typeof x==="object"){var s=(x.a||"").trim(),b=(x.b||"").trim();return s?(s+(b?" — "+b:"")):""; }
      return String(x||"").trim();
    }).filter(Boolean);
    return f.length?esc(f.join("\n")):"—";
  }
  if(typeof a==="string")return a.trim()?esc(a):"—";
  var parts=[];
  (a.sel||[]).forEach(function(v){
    if(v==="other"){var ol=q.otherLabel?q.otherLabel[lg]:(lg==="ar"?"أخرى":"Other");parts.push(ol+(a.extra?": "+a.extra:""));}
    else{var o=q.options&&q.options[v];if(o)parts.push(o[lg]);}
  });
  if(q.type==="suggest"&&a.extra)parts.push(a.extra);
  return parts.length?esc(parts.join("، ")):"—";
}

/* ── controls renderer ─────────────────────────────────────────── */
function ctrl(q){
  var t=q.type, id=q.id;

  if(t==="text"||t==="number"||t==="url"||t==="email"){
    var v=typeof answers[id]==="string"?answers[id]:"";
    return '<input class="inp" type="'+(t==="url"?"url":t==="email"?"email":t==="number"?"number":"text")+'" data-q="'+id+'" value="'+ea(v)+'" placeholder="'+ph(q)+'">';
  }
  if(t==="textarea"||t==="multitext"){
    var v2=typeof answers[id]==="string"?answers[id]:"";
    return '<textarea class="inp" rows="3" data-q="'+id+'" placeholder="'+ph(q)+'">'+esc(v2)+'</textarea>';
  }
  if(t==="phone"){
    var pd=Array.isArray(answers[id])?answers[id]:[{code:"+966",num:""}];
    var rows=pd.map(function(r,i){
      return '<div class="addrow">'
        +'<div class="phone-code"><input class="inp" data-q="'+id+'" data-field="phone" data-index="'+i+'" data-key="code" value="'+ea(r.code||"")+'" placeholder="+966"></div>'
        +'<div class="phone-num"><input class="inp" data-q="'+id+'" data-field="phone" data-index="'+i+'" data-key="num" value="'+ea(r.num||"")+'" placeholder="'+(L()==="ar"?"رقم الهاتف":"Phone number")+'"></div>'
        +(i>0?'<button class="delbtn" data-action="delField" data-q="'+id+'" data-index="'+i+'">&times;</button>':'')
      +'</div>';
    }).join("");
    return '<div class="addwrap phone-wrap">'+rows+'</div><button class="addbtn" data-action="addField" data-q="'+id+'" data-ftype="phone">'+T[L()].add+'</button>';
  }
  if(t==="multiadd"){
    var arr=Array.isArray(answers[id])?answers[id]:[""];if(!arr.length)arr=[""];
    var rows2=arr.map(function(v,i){return '<div class="addrow"><input class="inp" data-q="'+id+'" data-field="multi" data-index="'+i+'" value="'+ea(v)+'" placeholder="'+ph(q)+'">'+(i>0?'<button class="delbtn" data-action="delField" data-q="'+id+'" data-index="'+i+'">&times;</button>':'')+'</div>';}).join("");
    return '<div class="addwrap">'+rows2+'</div><button class="addbtn" data-action="addField" data-q="'+id+'" data-ftype="multi">'+T[L()].add+'</button>';
  }
  if(t==="multipair"){
    var arr3=Array.isArray(answers[id])?answers[id]:[{a:"",b:""}];if(!arr3.length)arr3=[{a:"",b:""}];
    var pa=q.pair.a[L()],pb=q.pair.b[L()];
    var rows3=arr3.map(function(o,i){
      return '<div class="addrow">'
        +'<input class="inp inp-sm" data-q="'+id+'" data-field="pair" data-index="'+i+'" data-key="a" value="'+ea(o&&o.a||"")+'" placeholder="'+ea(pa)+'">'
        +'<input class="inp inp-lg" data-q="'+id+'" data-field="pair" data-index="'+i+'" data-key="b" value="'+ea(o&&o.b||"")+'" placeholder="'+ea(pb)+'">'
        +(i>0?'<button class="delbtn" data-action="delField" data-q="'+id+'" data-index="'+i+'">&times;</button>':'')
      +'</div>';
    }).join("");
    return '<div class="addwrap">'+rows3+'</div><button class="addbtn" data-action="addField" data-q="'+id+'" data-ftype="pair">'+T[L()].add+'</button>';
  }
  if(t==="file"){
    var fn=typeof answers[id]==="string"?answers[id]:"";
    return '<label class="filez">'+IC.doc+'<span>'+(fn?esc(fn):T[L()].fileHint)+'</span><input type="file" data-q="'+id+'" hidden></label>';
  }
  if(t==="suggest"){
    var a2=ans(id);
    var chips=DIFF_SUGG[L()].map(function(s,i){
      var used=a2.sel.indexOf(i)>-1;
      return '<span class="suggest-chip'+(used?" used":"")+'" data-action="sugg" data-q="'+id+'" data-val="'+i+'">'+esc(s)+'</span>';
    }).join("");
    var textarea='<textarea class="inp" rows="2" data-q="'+id+'" data-field="extra" placeholder="'+ph(q)+'">'+esc(a2.extra||"")+'</textarea>';
    return '<div class="suggest-label">'+(L()==="ar"?"اختر من المقترحات أو اكتب بنفسك:":"Select from suggestions or write your own:")+'</div><div class="suggest-strip">'+chips+'</div>'+textarea;
  }

  /* generic multi/scale/adj */
  var a3=ans(id);
  var otherTxt=q.otherLabel?q.otherLabel[L()]:(L()==="ar"?"أخرى":"Other");
  var html="";
  if(t==="scale"){
    html='<div class="scale">';
    q.options.forEach(function(o,i){html+='<div class="sopt'+(a3.sel.indexOf(i)>-1?" sel":"")+'" data-action="opt" data-q="'+id+'" data-val="'+i+'">'+o[L()]+'</div>';});
    html+='</div>';
  } else if(q.adj){
    html='<div class="adjwrap">';
    q.options.forEach(function(o,i){html+='<div class="adj'+(a3.sel.indexOf(i)>-1?" sel":"")+'" data-action="opt" data-q="'+id+'" data-val="'+i+'">'+o[L()]+'</div>';});
    if(q.other)html+='<div class="adj'+(a3.sel.indexOf("other")>-1?" sel":"")+'" data-action="opt" data-q="'+id+'" data-val="other">'+otherTxt+'</div>';
    html+='</div><div class="adjcount">'+T[L()].adj(a3.sel.length)+'</div>';
    if(q.other&&a3.sel.indexOf("other")>-1)html+='<input class="inp" data-q="'+id+'" data-field="extra" value="'+ea(a3.extra||"")+'" placeholder="'+ea(L()==="ar"?"اكتب صفة أخرى…":"Type another word…")+'">';
  } else {
    html='<div class="opts">';
    q.options.forEach(function(o,i){html+='<div class="opt'+(a3.sel.indexOf(i)>-1?" sel":"")+'" data-action="opt" data-q="'+id+'" data-val="'+i+'"><span class="box">'+IC.check+'</span><span>'+o[L()]+'</span></div>';});
    if(q.other)html+='<div class="opt'+(a3.sel.indexOf("other")>-1?" sel":"")+'" data-action="opt" data-q="'+id+'" data-val="other"><span class="box">'+IC.check+'</span><span>'+otherTxt+'</span></div>';
    html+='</div>';
    if(q.other&&a3.sel.indexOf("other")>-1)html+='<input class="inp" data-q="'+id+'" data-field="extra" value="'+ea(a3.extra||"")+'" placeholder="'+ea(T[L()].otherPh)+'">';
  }
  return html;
}

function qmark(q){return '<button class="qmark" data-action="help" data-q="'+q.id+'" aria-label="توضيح">'+(L()==="ar"?"؟":"?")+'</button>';}
function helpPanel(q){
  var inner="";
  if(q.help.ex)inner+='<p><b>'+T[L()].eg+' </b>'+q.help.ex[L()]+'</p>';
  inner+='<p>'+q.help.why[L()]+'</p>';
  return '<div class="help collapsible closed" id="help-'+q.id+'"><div class="help-inner">'+inner+'</div></div>';
}

function vDetail(){
  var subs=getSubs(),s=null;
  for(var i=0;i<subs.length;i++)if(subs[i].id===state.curSub){s=subs[i];break;}
  if(!s){state.view="admin";return vAdmin();}
  var lg=s.lang||"ar";
  /* mark as reviewed */
  if(s.status==="new"){s.status="reviewed";var all=getSubs();for(var j=0;j<all.length;j++)if(all[j].id===s.id)all[j].status="reviewed";setSubs(all);}
  function adjList(id,cls){
    var a=s.answers[id];
    if(!a||!a.sel||!a.sel.length)return '<span style="color:var(--text-3);font-size:12px">—</span>';
    return a.sel.map(function(v){
      if(v==="other")return '<span class="atag '+cls+'">'+esc(a.extra||"—")+'</span>';
      return '<span class="atag '+cls+'">'+esc(ADJ[v]?ADJ[v][lg]:"")+'</span>';
    }).join("");
  }
  var gap='<div class="gap"><div class="gapcol"><div class="h">'+T.ar.cur+'</div>'+adjList("s5_current","")+'</div><div class="gapcol"><div class="h">'+T.ar.des+'</div>'+adjList("s5_desired","d")+'</div></div>';
  var groups=allStages().map(function(st){
    var rows=st.questions.map(function(q){
      if(q.id==="s5_current"||q.id==="s5_desired")return "";
      var g=GOLDEN[q.id];
      return '<div class="kv'+(g?" gold":"")+'"><div class="k">'+q.q.ar+(g?' <span class="gbadge">ذهبي</span>':"")+'</div><div class="v">'+fmt(q,s.answers[q.id],lg)+'</div></div>';
    }).join("");
    return rows?'<div class="group"><div class="group-h">'+st.title.ar+'</div>'+rows+'</div>':"";
  }).join("");
  return topbar("admin")+'<div class="wrapw"><div class="detail-top"><button class="ghost" data-action="backList">'+ni("prev")+'<span>'+(L()==="ar"?"رجوع":"Back")+'</span></button></div><div class="summary"><h2>'+esc(s.brand)+'</h2><div class="meta">'+fmtDate(s.date)+' · '+(s.lang==="ar"?"العربية":"English")+'</div>'+gap+'</div>'+groups+'</div>';
}

/* ── render ────────────────────────────────────────────────────── */
function applyDir(){
  var isAdmin=state.view==="admin"||state.view==="adminDetail"||state.view==="login";
  document.documentElement.dir=(!isAdmin&&state.lang==="en")?"ltr":"rtl";
  document.documentElement.lang=isAdmin?"ar":state.lang;
}
function render(){
  applyDir();
  var html;
  if(state.generating)html=vGen();
  else if(state.view==="landing")html=vLanding();
  else if(state.view==="form")html=vStage();
  else if(state.view==="thanks")html=vThanks();
  else if(state.view==="login")html=vLogin();
  else if(state.view==="admin")html=vAdmin();
  else if(state.view==="adminDetail")html=vDetail();
  document.getElementById("app").innerHTML=html;
}

/* ── generating animation ──────────────────────────────────────── */
function buildCtrlFromGenerated(q){
  /* Map generated question structure → same ctrl() format */
  if(!q.type)q.type="textarea";
  return q;
}

async function generateStages(){
  var brandName=typeof answers.s1_name==="string"?answers.s1_name.trim():"";
  var activity=typeof answers.s1_activity==="string"?answers.s1_activity.trim():"";
  var description=typeof answers.s2_desc==="string"?answers.s2_desc.trim():"";

  try{
    var resp=await fetch("/api/generate",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({brandName:brandName,activity:activity,description:description,lang:L()})
    });
    if(!resp.ok)throw new Error("API "+resp.status);
    var data=await resp.json();
    if(data.stages&&data.stages.length){
      /* Convert generated stages to STAGES-compatible format */
      DYNAMIC_STAGES=data.stages.map(function(st){
        return {
          title:st.title||{ar:"",en:""},
          questions:(st.questions||[]).map(function(q){
            /* Ensure options are in [{ar,en}] format */
            if(q.options&&q.options.length&&typeof q.options[0]==="string"){
              q.options=q.options.map(function(o){return {ar:o,en:o};});
            }
            if(!q.id)q.id="gen_"+Math.random().toString(36).slice(2);
            if(q.golden)GOLDEN[q.id]=1;
            return q;
          })
        };
      });
      console.log("Generated",DYNAMIC_STAGES.length,"stages");
    }else{
      DYNAMIC_STAGES=null; // fallback to static
    }
  }catch(err){
    console.warn("Generation failed, using fallback:",err.message);
    DYNAMIC_STAGES=null; // fallback to static
  }
}

function startGen(){
  state.generating=true;state.genPct=0;render();
  state.genTimer=setInterval(function(){
    state.genPct=Math.min(state.genPct+(Math.random()*8+3),95);
    var fill=document.getElementById("genFill");
    var pctEl=document.getElementById("genPct");
    if(fill)fill.style.width=Math.round(state.genPct)+"%";
    if(pctEl)pctEl.textContent=T[L()].genPct(Math.round(state.genPct));
  },300);
  setTimeout(async function(){
    clearInterval(state.genTimer);state.genPct=90;
    var fill=document.getElementById("genFill");
    var pctEl=document.getElementById("genPct");
    if(fill)fill.style.width="90%";
    if(pctEl)pctEl.textContent=T[L()].genPct(90);
    /* Call actual generation */
    await generateStages();
    state.genPct=100;
    if(fill)fill.style.width="100%";
    if(pctEl)pctEl.textContent=T[L()].genPct(100);
    setTimeout(function(){
      state.generating=false;state.stage=3;saveDraft();render();window.scrollTo(0,0);
    },400);
  },2500);
}

/* ── toggle option ─────────────────────────────────────────────── */
function toggleOpt(qid,raw){
  var q=findQ(qid),a=ans(qid);
  var val=raw==="other"?"other":parseInt(raw,10);
  if(q.type==="scale"){a.sel=(a.sel[0]===val)?[]:[val];}
  else{var idx=a.sel.indexOf(val);if(idx>-1)a.sel.splice(idx,1);else{if(q.limit&&a.sel.length>=q.limit[1])return;a.sel.push(val);}}
  saveDraft();render();
}

/* ── submit ────────────────────────────────────────────────────── */
function doSubmit(){
  var name=(typeof answers.s1_name==="string"&&answers.s1_name.trim())?answers.s1_name.trim():"—";
  var subs=getSubs();
  subs.unshift({id:"s"+Date.now(),brand:name,lang:state.lang,date:new Date().toISOString(),status:"new",answers:JSON.parse(JSON.stringify(answers))});
  setSubs(subs);clearDraft();answers={};state.stage=1;state.view="thanks";render();window.scrollTo(0,0);
}

/* ── events ────────────────────────────────────────────────────── */
var app=document.getElementById("app");

app.addEventListener("click",function(e){
  var t=e.target.closest("[data-action]");if(!t)return;
  var act=t.getAttribute("data-action");
  if(act==="lang"){state.lang=t.getAttribute("data-lang");answers={};state.stage=1;state.view="form";clearDraft();render();window.scrollTo(0,0);}
  else if(act==="resume"){loadDraft();state.view="form";render();window.scrollTo(0,0);}
  else if(act==="fresh"){clearDraft();answers={};state.stage=1;render();}
  else if(act==="next"){if(state.stage===2)startGen();else{state.stage++;saveDraft();render();window.scrollTo(0,0);}}
  else if(act==="prev"){state.stage--;render();window.scrollTo(0,0);}
  else if(act==="opt"){toggleOpt(t.getAttribute("data-q"),t.getAttribute("data-val"));}
  else if(act==="sugg"){var qi=t.getAttribute("data-q"),vi=parseInt(t.getAttribute("data-val"),10);var as=ans(qi);var ix=as.sel.indexOf(vi);if(ix>-1)as.sel.splice(ix,1);else as.sel.push(vi);saveDraft();render();}
  else if(act==="help"){var p=document.getElementById("help-"+t.getAttribute("data-q"));if(p)p.classList.toggle("closed");}
  else if(act==="addField"){
    var qa=t.getAttribute("data-q"),ft=t.getAttribute("data-ftype");
    var blank=ft==="pair"?{a:"",b:""}:ft==="phone"?{code:"",num:""}:"";
    var ar0=Array.isArray(answers[qa])?answers[qa].slice():[blank];ar0.push(blank);answers[qa]=ar0;saveDraft();render();
  }
  else if(act==="delField"){
    var qd=t.getAttribute("data-q"),di=parseInt(t.getAttribute("data-index"),10);
    var q2=findQ(qd);
    var bk2=(q2&&(q2.type==="multipair"||q2.type==="phone"))?{a:"",b:""}:"";
    if(q2&&q2.type==="phone")bk2={code:"",num:""};
    var ar2=Array.isArray(answers[qd])?answers[qd].slice():[];
    ar2.splice(di,1);if(!ar2.length)ar2=[bk2];answers[qd]=ar2;saveDraft();render();
  }
  else if(act==="submit"){doSubmit();}
  else if(act==="goAdmin"){
    if(isAuth()){state.view="admin";}else{state.loginErr="";state.view="login";}
    render();window.scrollTo(0,0);
  }
  else if(act==="goForm"){state.view=hasDraft()?"landing":"landing";render();window.scrollTo(0,0);}
  else if(act==="goLanding"){clearInterval(state.genTimer);state.generating=false;state.view="landing";render();window.scrollTo(0,0);}
  else if(act==="viewSub"){state.curSub=t.getAttribute("data-id");state.view="adminDetail";render();window.scrollTo(0,0);}
  else if(act==="backList"){state.view="admin";render();window.scrollTo(0,0);}
  else if(act==="restart"){clearDraft();answers={};state.stage=1;state.view="landing";render();window.scrollTo(0,0);}
  else if(act==="doLogin"){
    var u=document.getElementById("lu"),p2=document.getElementById("lp");
    if(u&&p2&&u.value===ADMIN_USER&&p2.value===ADMIN_PASS){setAuth(true);state.view="admin";state.loginErr="";render();window.scrollTo(0,0);}
    else{state.loginErr=T[L()].loginErr;render();}
  }
  else if(act==="logout"){setAuth(false);state.view="landing";render();}
});

app.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&state.view==="login"){var btn=document.querySelector("[data-action=doLogin]");if(btn)btn.click();}
});

app.addEventListener("input",function(e){
  var el=e.target.closest("[data-q]");if(!el)return;
  if(el.type==="file")return;
  var qid=el.getAttribute("data-q"),field=el.getAttribute("data-field");
  if(field==="extra"){ans(qid).extra=el.value;}
  else if(field==="multi"){var i=parseInt(el.getAttribute("data-index"),10);var arr=Array.isArray(answers[qid])?answers[qid].slice():[];while(arr.length<=i)arr.push("");arr[i]=el.value;answers[qid]=arr;}
  else if(field==="pair"){var ix2=parseInt(el.getAttribute("data-index"),10);var key=el.getAttribute("data-key");var arr2=Array.isArray(answers[qid])?answers[qid].slice():[];while(arr2.length<=ix2)arr2.push({a:"",b:""});if(typeof arr2[ix2]!=="object")arr2[ix2]={a:"",b:""};arr2[ix2][key]=el.value;answers[qid]=arr2;}
  else if(field==="phone"){var ix3=parseInt(el.getAttribute("data-index"),10);var key3=el.getAttribute("data-key");var arr3=Array.isArray(answers[qid])?answers[qid].slice():[];while(arr3.length<=ix3)arr3.push({code:"",num:""});if(typeof arr3[ix3]!=="object")arr3[ix3]={code:"",num:""};arr3[ix3][key3]=el.value;answers[qid]=arr3;}
  else{answers[qid]=el.value;}
  saveDraft();
});

app.addEventListener("change",function(e){
  var el=e.target.closest('input[type=file][data-q]');if(!el)return;
  var qid=el.getAttribute("data-q"),f=el.files&&el.files[0];answers[qid]=f?f.name:"";saveDraft();render();
});
